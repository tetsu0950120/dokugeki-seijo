    <style>

            line-height: 1.5;

        }

            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;

        .btn-danger { background-color: #e74c3c; color: white; }

<body>

<div class="container">
    <h1>毒物劇物（実地・識別・解毒）暗記アプリ</h1>

    <div class="stats">

    </div>

    <div class="card" id="quiz-card">
        <div>

        </div>

        <div class="answer-box" id="a-box">

            <span id="a-text">解答のテキスト</span>
        </div>
    </div>

    <div id="control-panel">
        <button class="btn-primary" id="btn-show-answer" onclick="showAnswer()">解答を見る</button>
        
        <div class="btn-group hidden" id="judge-buttons">
            <button class="btn-danger" onclick="answerResult(false)">× 苦手に追加</button>
            <button class="btn-success" onclick="answerResult(true)">◯ 覚えた！</button>
        </div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 8px;">
        <button class="btn-outline" onclick="filterWeak()">苦手のみ出題</button>
        <button class="btn-outline" onclick="resetAll()">全問リセット</button>
    </div>
</div>

let quizData = [];
let currentIndex = 0;
let weakList = JSON.parse(localStorage.getItem('dokugeki_weak') || '[]');
let isWeakMode = false; // 「苦手のみ出題」モードかどうかを判別するフラグ

// 配列をシャッフルする関数（ダステンフェルドの手法）
function shuffleArray(array) {
    const clone = [...array];
    for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
    }
    return clone;
}

function initQuiz() {
    updateStats();
    if (quizData.length === 0) {
        document.getElementById('q-text').textContent = isWeakMode 
            ? "苦手な問題はすべて克服しました！" 
            : "すべての問題を演習しました！";
        document.getElementById('control-panel').classList.add('hidden');
        return;
    }
    showQuestion();
}

function showQuestion() {
    const q = quizData[currentIndex];
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('a-text').innerText = Array.isArray(q.a) ? q.a.join(', ') : q.a;
    
    document.getElementById('a-box').style.display = 'none';
    document.getElementById('btn-show-answer').classList.remove('hidden');
    document.getElementById('judge-buttons').classList.add('hidden');
}

function showAnswer() {
    document.getElementById('a-box').style.display = 'block';
    document.getElementById('btn-show-answer').classList.add('hidden');
    document.getElementById('judge-buttons').classList.remove('hidden');
}

function answerResult(isCorrect) {
    const currentQ = quizData[currentIndex];
    
    if (isCorrect) {
        // 「苦手のみ出題」モード中に正解したら苦手リストから削除する
        if (isWeakMode) {
            weakList = weakList.filter(item => item.q !== currentQ.q);
            localStorage.setItem('dokugeki_weak', JSON.stringify(weakList));
            
            // 現在の出題リスト（quizData）からも削除し、インデックスを調整する
            quizData.splice(currentIndex, 1);
            if (currentIndex >= quizData.length && quizData.length > 0) {
                currentIndex = 0;
            }
            initQuiz();
            return;
        }
    } else {
        // 不正解（苦手に追加）の処理
        if (!weakList.some(item => item.q === currentQ.q)) {
            weakList.push(currentQ);
            localStorage.setItem('dokugeki_weak', JSON.stringify(weakList));
        }
    }
    
    currentIndex++;
    if (currentIndex >= quizData.length) {
        alert("1周完了しました！問題を再シャッフルします。");
        quizData = shuffleArray(quizData);
        currentIndex = 0;
    }
    initQuiz();
}

function updateStats() {
    document.getElementById('current-index').textContent = quizData.length ? currentIndex + 1 : 0;
    document.getElementById('total-count').textContent = quizData.length;
    document.getElementById('weak-count').textContent = weakList.length;
}

function filterWeak() {
    if (weakList.length === 0) {
        alert("苦手リストに登録されている問題はありません。");
        return;
    }
    isWeakMode = true; // 苦手モードをオン
    quizData = shuffleArray(weakList);
    currentIndex = 0;
    document.getElementById('control-panel').classList.remove('hidden');
    initQuiz();
}

function resetAll() {
    isWeakMode = false; // 通常モードに戻す
    
    // 苦手リストとlocalStorageを完全にリセット
    weakList = [];
    localStorage.removeItem('dokugeki_weak');
